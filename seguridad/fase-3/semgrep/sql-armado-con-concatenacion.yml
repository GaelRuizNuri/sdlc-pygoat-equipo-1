rules:
    
  - id: sql-armado-con-concatenacion
    languages: [python]
    severity: ERROR
    message: >-
      La consulta SQL se construye con el operador +. Pase los valores como
      parámetros de execute() para cumplir el requerimiento #12.
    metadata:
      requerimiento: "#12"
      asvs: "1.2.4"
      cwe: "CWE-89"
    pattern: '$CURSOR.execute($IZQUIERDA + $DERECHA, ...)'

