# Fase 3: copie este archivo a .github/workflows/scorecard.yml.
# OpenSSF Scorecard califica las prácticas de seguridad del repositorio.
# Con publish_results: true el workflow debe quedar así de simple: solo actions
# aprobadas y permisos de solo lectura en el nivel superior.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analisis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@e2f20e631ae6d7dd3b768f56a5d2af784dd54791
        with:
          results_file: resultados.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          name: reporte-scorecard
          path: resultados.sarif

      - uses: github/codeql-action/upload-sarif@11d5960a326750d5838078e36cf38b85af677262
        with:
          sarif_file: resultados.sarif
